<!DOCTYPE html>
<!--
  =====================================================================
  OscarOS — Portfolio d'Oscar Bonant (BTS SIO)
  =====================================================================
  Ce fichier est le SQUELETTE du site : il contient uniquement la
  structure des différents « écrans » du système d'exploitation simulé.
  Tout le contenu (textes, compétences, projets, liens) est rangé dans
  assets/js/data.js et injecté dans la page par JavaScript.

  Déroulé d'une visite :
    1. #boot        → écran de démarrage (logo « ob » animé + barre de chargement)
    2. #oobe        → « première installation » façon Windows = À PROPOS (5 étapes)
    3. #hello       → transition « Préparation de votre bureau… »
    4. #desktop     → le bureau : icônes, fenêtres, dock escamotable, barre du haut
    5. #extinction  → l'écran s'éteint progressivement (icône Veille)
    6. #veille-erreur puis #terminal → la veille technologique, puis redémarrage

  Les écrans 1 à 5 sont regroupés dans #os-screen : c'est ce bloc entier
  qui « s'éteint » lors de la mise en veille.
  =====================================================================
-->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover : utilise tout l'écran sur les téléphones à encoche -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OscarOS — Portfolio d'Oscar Bonant</title>
  <meta name="description" content="Portfolio d'Oscar Bonant, étudiant en BTS SIO : un mini système d'exploitation à explorer (compétences, réalisations, veille technologique, contact).">
  <meta name="author" content="Oscar Bonant">
  <!-- Couleur de la barre du navigateur sur mobile -->
  <meta name="theme-color" content="#071a3d">

  <!-- Icône de l'onglet : le logo « ob » dessiné en SVG (pas de fichier image à charger) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230b1630'/%3E%3Cg transform='translate(7 18) scale(.212)'%3E%3Cpath fill='%23e8eef7' fill-rule='evenodd' d='M0 76a76 76 0 1 0 152 0a76 76 0 1 0-152 0zM80 76a36 36 0 1 0 72 0a36 36 0 1 0-72 0zM101 76a15 15 0 1 0 30 0a15 15 0 1 0-30 0zM159 78a38 38 0 1 0 76 0a38 38 0 1 0-76 0zM182 78a15 15 0 1 0 30 0a15 15 0 1 0-30 0z'/%3E%3Cpath fill='%23e8eef7' d='M157 3h21v113h-21z'/%3E%3Ccircle cx='116' cy='76' r='25.5' fill='none' stroke='%234cc2ff' stroke-width='21'/%3E%3C/g%3E%3C/svg%3E">

  <!-- Polices Google : Geist (interface) et JetBrains Mono (terminal).
       « preconnect » ouvre la connexion au serveur de polices en avance. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Feuilles de style, de la plus générale à la plus spécifique.
       « ?v=2.4 » : numéro de version. Le navigateur garde les fichiers en
       mémoire (cache) ; changer ce numéro après une mise à jour l'oblige
       à télécharger les nouvelles versions (CSS et JS). -->
  <link rel="stylesheet" href="assets/css/base.css?v=2.4">      <!-- variables, verre, boutons -->
  <link rel="stylesheet" href="assets/css/boot.css?v=2.4">      <!-- démarrage + slides À propos -->
  <link rel="stylesheet" href="assets/css/desktop.css?v=2.4">   <!-- fond, icônes, dock, barre -->
  <link rel="stylesheet" href="assets/css/windows.css?v=2.4">   <!-- fenêtres -->
  <link rel="stylesheet" href="assets/css/apps.css?v=2.4">      <!-- Compétences, Réalisations, Contact -->
  <link rel="stylesheet" href="assets/css/veille.css?v=2.4">    <!-- extinction + terminal -->
</head>

<body>
  <!-- Message affiché uniquement si JavaScript est désactivé -->
  <noscript>
    <div class="noscript">
      <p>Ce portfolio est une application interactive : merci d'activer JavaScript pour le découvrir.</p>
    </div>
  </noscript>

  <!-- =================================================================
       #os-screen : tout ce qui s'affiche « dans le moniteur ».
       Quand on met en veille, ce bloc entier s'éteint.
       ================================================================= -->
  <div class="os-screen" id="os-screen">

    <!-- 0. FOND D'ÉCRAN en couches superposées (construit par wallpaper.js) -->
    <div class="wallpaper" id="wallpaper" aria-hidden="true"></div>

    <!-- 1. ÉCRAN DE DÉMARRAGE
         Le logo « ob » est écrit directement ici (et non par JavaScript)
         pour qu'il s'affiche dès la toute première image de la page.
         Chaque partie a sa classe : elles s'animent l'une après l'autre
         (voir « Logo » dans boot.css). -->
    <div class="screen boot is-visible" id="boot" aria-live="polite">
      <div class="boot__logo" aria-hidden="true">
        <span class="boot__halo"></span>
        <svg class="logo" viewBox="0 0 272 152">
          <defs>
            <!-- « Matière claire » : la même que celle des icônes d'applications -->
            <linearGradient id="logo-matiere" x1="0" y1="0" x2=".35" y2="1">
              <stop offset="0" stop-color="#ffffff"/>
              <stop offset=".55" stop-color="#e2e9f3"/>
              <stop offset="1" stop-color="#9fb2ca"/>
            </linearGradient>
            <!-- Anneau du « o » : bleu d'accent du système -->
            <linearGradient id="logo-accent" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#9be7ff"/>
              <stop offset=".5" stop-color="#4cc2ff"/>
              <stop offset="1" stop-color="#0a6cff"/>
            </linearGradient>
            <!-- Reflet qui balaie le logo une fois dessiné -->
            <linearGradient id="logo-reflet" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#fff" stop-opacity="0"/>
              <stop offset=".5" stop-color="#fff" stop-opacity=".85"/>
              <stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
            <!-- Le reflet n'apparaît que sur les formes du logo -->
            <mask id="logo-masque">
              <circle cx="76" cy="76" r="76" fill="#fff"/>
              <rect x="157" y="3" width="21" height="113" fill="#fff"/>
              <circle cx="197" cy="78" r="26.5" fill="none" stroke="#fff" stroke-width="23"/>
            </mask>
          </defs>
          <!-- Le disque, puis l'anneau du « o » qui se dessine dessus -->
          <circle class="logo__disc" cx="76" cy="76" r="76" fill="url(#logo-matiere)"/>
          <circle class="logo__ring-bg" cx="116" cy="76" r="25.5" fill="none" stroke="#04070d" stroke-width="21"/>
          <circle class="logo__ring" cx="116" cy="76" r="25.5" fill="none" stroke="url(#logo-accent)" stroke-width="21" transform="rotate(-90 116 76)"/>
          <!-- Le « b » : une barre et une boucle -->
          <g class="logo__b" fill="url(#logo-matiere)">
            <rect x="157" y="3" width="21" height="113"/>
            <circle cx="197" cy="78" r="26.5" fill="none" stroke="url(#logo-matiere)" stroke-width="23"/>
          </g>
          <!-- Bande de lumière (animée de gauche à droite) -->
          <g mask="url(#logo-masque)">
            <rect class="logo__sheen" x="-60" y="-10" width="60" height="172" fill="url(#logo-reflet)" transform="skewX(-18)"/>
          </g>
          <text class="logo__name" x="138" y="134">Oscar Bonant</text>
        </svg>
      </div>
      <!-- Barre de chargement (sa durée est réglée par oobe.js) -->
      <div class="loader" id="boot-loader" aria-hidden="true"><i></i></div>
      <p class="sr-only">Démarrage du portfolio…</p>
    </div>

    <!-- 2. INSTALLATION (OOBE = Out-Of-Box Experience) → rubrique « À propos » -->
    <div class="screen oobe" id="oobe" hidden>
      <div class="oobe__card glass" role="dialog" aria-modal="true" aria-labelledby="oobe-title">
        <!-- Colonne gauche : illustration de l'étape (injectée par oobe.js) -->
        <div class="oobe__visual" id="oobe-visual" aria-hidden="true"></div>
        <!-- Colonne droite : progression + contenu + boutons -->
        <div class="oobe__content">
          <ol class="oobe__progress" id="oobe-progress" aria-label="Progression"></ol>
          <div class="oobe__slide" id="oobe-slide"></div>
          <div class="oobe__actions">
            <button class="btn btn--ghost" id="oobe-prev" type="button">Précédent</button>
            <button class="btn btn--primary" id="oobe-next" type="button">Suivant</button>
          </div>
        </div>
      </div>
      <!-- Pied de l'écran d'installation (comme sous Windows) -->
      <div class="oobe__footer">
        <div class="oobe__sysicons" id="oobe-sysicons" aria-hidden="true"></div>
        <button class="oobe__skip" id="oobe-skip" type="button">Passer l'introduction →</button>
      </div>
    </div>

    <!-- 3. TRANSITION « Préparation de votre bureau » -->
    <div class="screen hello" id="hello" hidden aria-live="polite">
      <p class="hello__text" id="hello-text"></p>
      <div class="loader loader--small" id="hello-loader" aria-hidden="true"><i></i></div>
    </div>

    <!-- 4. LE BUREAU -->
    <div class="screen desktop" id="desktop" hidden>

      <!-- Barre du haut (façon macOS) : menu système, appli active, horloge -->
      <header class="topbar glass" id="topbar">
        <div class="topbar__left">
          <button class="topbar__logo" id="system-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="system-menu">
            <span>OscarOS</span>   <!-- le petit logo « ob » est ajouté devant par desktop.js -->
          </button>
          <span class="topbar__app" id="topbar-app">Bureau</span>
        </div>
        <div class="topbar__right" id="topbar-status"></div>
        <!-- Menu système (s'ouvre sous le logo) -->
        <div class="system-menu glass" id="system-menu" role="menu" hidden></div>
      </header>

      <!-- Grand titre central (le « sujet » du fond d'écran) -->
      <div class="desktop__hero" aria-hidden="true">
        <p class="desktop__greeting" id="desktop-greeting">Bonjour</p>
        <p class="desktop__name" id="desktop-name">Oscar</p>
        <p class="desktop__tag" id="desktop-tag"></p>
        <p class="desktop__hint">Cliquez sur une icône pour ouvrir une application · glissez-la pour la déplacer</p>
      </div>

      <!-- Couche des ondulations quand on clique sur le fond -->
      <div class="desktop__ripples" id="ripples" aria-hidden="true"></div>

      <!-- Icônes du bureau (placées aléatoirement par desktop.js) -->
      <div class="desktop__icons" id="desktop-icons" role="group" aria-label="Applications du bureau"></div>

      <!-- Couche des fenêtres (gérée par windows.js) -->
      <div class="desktop__windows" id="windows"></div>

      <!-- Dock ESCAMOTABLE : caché par défaut pour laisser toute la place
           aux fenêtres. Une petite poignée apparaît quand la souris
           approche du bas de l'écran, au centre ; la survoler (ou la
           toucher) déplie le dock. -->
      <button class="dock-handle" id="dock-handle" type="button" aria-controls="dock" aria-expanded="false" aria-label="Afficher la barre des applications"></button>
      <nav class="dock glass" id="dock" aria-label="Barre des applications"></nav>

      <!-- Zone des notifications -->
      <div class="toasts" id="toasts" aria-live="polite"></div>
    </div>

    <!-- 5. EXTINCTION : voile noir qui recouvre l'écran de plus en plus vite -->
    <div class="extinction" id="extinction" hidden></div>
  </div>

  <!-- =================================================================
       6 bis. MESSAGE D'ERREUR DE MISE EN VEILLE
       Console brute (texte sur fond noir, sans mise en forme) qui
       explique ce qui se passe avant l'ouverture du terminal stylé.
       ================================================================= -->
  <div class="veille-erreur" id="veille-erreur" hidden aria-live="assertive"></div>

  <!-- =================================================================
       6. TERMINAL DE VEILLE TECHNOLOGIQUE (hors du « moniteur » principal)
       ================================================================= -->
  <div class="terminal" id="terminal" hidden>
    <div class="terminal__frame">
      <!-- Barre d'état du terminal -->
      <header class="terminal__status">
        <span class="terminal__status-left"><b>OSCAR-OS</b> v1.0 <span class="t-dim">──</span> TTY1 <span class="t-dim">──</span> MODE VEILLE</span>
        <span class="terminal__status-mid" id="term-file"></span>
        <span class="terminal__status-right" id="term-clock">00:00:00</span>
      </header>
      <!-- Sortie du terminal : le texte s'écrit ici petit à petit -->
      <main class="terminal__output" id="term-output" aria-live="off" aria-label="Veille technologique"></main>
      <!-- Colonne de droite : illustration isométrique + sommaire -->
      <aside class="terminal__aside" id="term-aside" aria-label="Sommaire de la veille"></aside>
      <!-- Aide en bas : explique quoi faire (accélérer / redémarrer) -->
      <footer class="terminal__hint" id="term-hint"></footer>
    </div>
  </div>

  <!-- =================================================================
       SCRIPTS — chargés dans l'ordre grâce à « defer ».
       On n'utilise pas les modules ES (type="module") pour que le site
       fonctionne aussi en ouvrant simplement index.html (file://).
       ================================================================= -->
  <script src="assets/js/data.js?v=2.4" defer></script>            <!-- 1. contenu -->
  <script src="assets/js/core.js?v=2.4" defer></script>            <!-- 2. outils communs -->
  <script src="assets/js/icons.js?v=2.4" defer></script>           <!-- 3. icônes SVG + logo -->
  <script src="assets/js/wallpaper.js?v=2.4" defer></script>       <!-- 4. fond d'écran en couches -->
  <script src="assets/js/illustrations.js?v=2.4" defer></script>   <!-- 5. illustrations des slides -->
  <script src="assets/js/windows.js?v=2.4" defer></script>         <!-- 6. gestionnaire de fenêtres -->
  <script src="assets/js/apps/competences.js?v=2.4" defer></script><!-- 7. appli Compétences (graphe) -->
  <script src="assets/js/apps/realisations.js?v=2.4" defer></script><!-- 8. appli Réalisations -->
  <script src="assets/js/apps/contact.js?v=2.4" defer></script>    <!-- 9. appli Contact -->
  <script src="assets/js/veille.js?v=2.4" defer></script>          <!-- 10. veille + terminal -->
  <script src="assets/js/desktop.js?v=2.4" defer></script>         <!-- 11. bureau + dock -->
  <script src="assets/js/oobe.js?v=2.4" defer></script>            <!-- 12. démarrage + slides -->
  <script src="assets/js/main.js?v=2.4" defer></script>            <!-- 13. chef d'orchestre -->
</body>
</html>
